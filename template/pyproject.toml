[project]
name = "{{project_name}}"
version = "0.1.0"
description = "基于 FastAPI + SQLAlchemy 2.x 的项目模板"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7.4",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
